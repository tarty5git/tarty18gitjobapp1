spring:
  application:
    name: linkedin-job-bot
  profiles:
    active: h2
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

bot:
  auto-apply-interval-ms: 60000
  default-target-location: "Remote"
  max-results-per-cycle: 10
  linkedin:
    request-timeout-ms: 10000
